name: roastline
description: "RoastLine - aplikasi manajemen deadline yang nge-roast kamu kalau nunda tugas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  # Backend / database / auth
  supabase_flutter: ^2.9.0

  # Push notification (FCM)
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0

  # Notifikasi lokal terjadwal (reminder deadline)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/

# Ikon aplikasi jalankan: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#8B1E24"
  adaptive_icon_foreground: "assets/branding/icon.png"
  remove_alpha_ios: true

# Splash screen -> jalankan: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#8B1E24"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#8B1E24"
    image: assets/branding/splash_logo.png
